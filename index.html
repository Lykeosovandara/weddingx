<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="canvas"></canvas>
</body>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    class Raindrop {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.speed = Math.random() * 3 + 1;
            this.size = Math.random() * 1 + 1;
        }

        update() {
            this.y += this.speed;
            if (this.y > canvas.height) {
                this.y = 0;
                this.x = Math.random() * canvas.width;
            }
        }

        draw() {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.bezierCurveTo(this.x, this.y - 3*this.size, this.x + 3*this.size, this.y - 3*this.size, this.x + 3*this.size, this.y);
            ctx.bezierCurveTo(this.x + 3*this.size, this.y - 6*this.size, this.x, this.y - 6*this.size, this.x, this.y - 3*this.size);
            ctx.closePath();
            ctx.fillStyle = 'pink';
            ctx.fill();
        }
    }

    const raindrops = Array.from({ length: 100 }, () => new Raindrop());

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        raindrops.forEach(raindrop => {
            raindrop.update();
            raindrop.draw();
        });
        requestAnimationFrame(animate);
    }

    animate();
</script>
</html>
