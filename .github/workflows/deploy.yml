# Deploy Nuxt app to GitHub Pages - Multi-branch deployment
name: Deploy to GitHub Pages

on:
  # Runs on pushes to any branch
  push:
    branches:
      - chealing_hak
      # Add more branches as needed, or use pattern matching:
      # - 'feature/**'
      # - 'release/**'
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment per branch
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Set the base URL based on branch name
      - name: Set base URL
        id: base-url
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${{ github.ref_name }}"
          
          if [ "$BRANCH" = "main" ]; then
            # Main branch deploys to repo root
            echo "base_url=/${REPO_NAME}/" >> $GITHUB_OUTPUT
            echo "deploy_path=.output/public" >> $GITHUB_OUTPUT
          else
            # Other branches deploy to subdirectory
            echo "base_url=/${REPO_NAME}/${BRANCH}/" >> $GITHUB_OUTPUT
            echo "deploy_path=.output/public" >> $GITHUB_OUTPUT
          fi
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Generate static files
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: ${{ steps.base-url.outputs.base_url }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SPREAD_SHEET_ID: ${{ secrets.SPREAD_SHEET_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.base-url.outputs.deploy_path }}

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
